<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcf9f1"/>
      <stop offset="52%" stop-color="#f6efdf"/>
      <stop offset="100%" stop-color="#e9dcc3"/>
    </linearGradient>
    <radialGradient id="sun" cx="82%" cy="14%" r="62%">
      <stop offset="0" stop-color="#fffdf2" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#fff4d9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e9dcc3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#fffdf0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".4" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".085"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="840" fill="url(#paper)"/>
  <rect width="1600" height="840" fill="url(#sun)"/>
  <!-- Window-like light is kept on the right so the site's title remains readable. -->
  <g opacity=".48" filter="url(#blur)" transform="translate(920 20) rotate(-13 220 280)">
    <rect x="100" y="10" width="590" height="610" rx="250" fill="#fffdf0"/>
    <path d="M100 270h590 M394 12v610 M205 60v560 M570 60v560" stroke="#aa9265" stroke-width="35" opacity=".23"/>
  </g>
  <path d="M1060 0 1600 0 1600 590 1390 420Z" fill="url(#light)" opacity=".5"/>
  <!-- Quiet watercolor washes. -->
  <ellipse cx="130" cy="760" rx="470" ry="170" fill="#b6bea7" opacity=".16" filter="url(#blur)"/>
  <ellipse cx="1390" cy="745" rx="360" ry="220" fill="#d1b788" opacity=".17" filter="url(#blur)"/>
  <g stroke="#778b6b" stroke-linecap="round" fill="none" opacity=".14">
    <path d="M1480 0c-34 104-105 159-170 199-60 42-106 82-124 135" stroke-width="6"/>
    <path d="M1475 40c55 15 85 41 115 85M1408 111c-74-10-117-36-149-86M1350 158c43 27 76 66 91 102M1302 205c-56 18-99 15-138 2" stroke-width="4"/>
  </g>
  <g fill="#839275" opacity=".13">
    <ellipse cx="1515" cy="71" rx="57" ry="18" transform="rotate(24 1515 71)"/>
    <ellipse cx="1258" cy="25" rx="59" ry="17" transform="rotate(22 1258 25)"/>
    <ellipse cx="1438" cy="255" rx="66" ry="20" transform="rotate(66 1438 255)"/>
    <ellipse cx="1167" cy="207" rx="57" ry="18" transform="rotate(5 1167 207)"/>
  </g>
  <!-- A barely-there musical staff along the bottom edge. -->
  <g stroke="#988e76" stroke-width="1.7" fill="none" opacity=".12">
    <path d="M130 730Q340 716 540 724T950 730 M130 746Q340 732 540 740T950 746 M130 762Q340 748 540 756T950 762 M130 778Q340 764 540 772T950 778 M130 794Q340 780 540 788T950 794"/>
    <path d="M600 747v-55m0 55c-16-10-32-2-25 11s30 4 25-11ZM760 770v-57m0 57c-15-11-33-4-28 9s33 6 28-9Z" fill="#988e76"/>
  </g>
  <rect width="1600" height="840" filter="url(#grain)" opacity=".55"/>
</svg>