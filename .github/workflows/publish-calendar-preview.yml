name: Publish month calendar preview

on:
  push:
    branches: [feature/month-calendar-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanxi-calendar-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build isolated read-only calendar preview
        env:
          VITE_BASE_PATH: /NanxiChurchChoir/preview/calendar-v1/
          VITE_READ_ONLY_PREVIEW: "true"
          VITE_API_BASE_URL: https://nanxichurchlinebot.onrender.com
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
      - name: Validate calendar features and full-resolution media
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/NanxiChurchChoir/preview/calendar-v1/assets/' dist/index.html
          grep -R -q '詩班行事曆' dist/assets/*.js
          grep -R -q '設計預覽模式為唯讀' dist/assets/*.js
          for asset in church-hero.jpg hills.jpg flowers-right.png flowers-left.png; do
            test "$(wc -c < "dist/media/$asset")" -gt 100000
          done
      - name: Publish only to preview/calendar-v1
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: preview/calendar-v1
          keep_files: true
          enable_jekyll: true
