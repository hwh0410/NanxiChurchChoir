name: Publish choir site to GitHub Pages

# After the approved visual release, production deployments are manual-only.
# Phase 2 changes are reviewed and tested before release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanxi-production-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate Google OAuth client ID and build production
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: https://nanxichurchlinebot.onrender.com
          VITE_BASE_PATH: /NanxiChurchChoir/
          VITE_READ_ONLY_PREVIEW: "false"
        shell: bash
        run: |
          if [[ ! "$VITE_GOOGLE_CLIENT_ID" =~ ^[0-9]+-[[:alnum:]-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::Set the VITE_GOOGLE_CLIENT_ID repository variable before publishing."
            exit 1
          fi
          npm run build
      - name: Verify release assets and site base path
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/NanxiChurchChoir/assets/' dist/index.html
          grep -q '楠西教會聖歌隊' dist/index.html
          for asset in church-hero.jpg hills.jpg flowers-left.png flowers-right.png; do
            test -s "dist/media/$asset" || { echo "::error::Missing $asset"; exit 1; }
            test "$(wc -c < "dist/media/$asset")" -gt 100000 || { echo "::error::Low-resolution image $asset"; exit 1; }
          done
      - name: Publish to existing gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
