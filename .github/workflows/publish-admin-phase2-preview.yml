name: Publish admin phase 2 preview

on:
  push:
    branches: [feature/admin-phase2-workflow-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanxi-admin-phase2-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build non-writing preview
        env:
          VITE_BASE_PATH: /NanxiChurchChoir/preview/admin-phase2-v1/
          VITE_READ_ONLY_PREVIEW: "true"
          VITE_API_BASE_URL: https://nanxichurchlinebot.onrender.com
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
      - name: Validate read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/NanxiChurchChoir/preview/admin-phase2-v1/assets/' dist/index.html
          grep -R -q '設計預覽模式為唯讀' dist/assets/*.js
          grep -R -q '聚會與曲目安排工作台' dist/assets/*.js
          for asset in church-hero.jpg hills.jpg flowers-left.png flowers-right.png; do
            test "$(wc -c < "dist/media/$asset")" -gt 100000
          done
      - name: Publish isolated preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: preview/admin-phase2-v1
          keep_files: true
          enable_jekyll: true
