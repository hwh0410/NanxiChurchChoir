name: Stage generated design artwork

on:
  push:
    branches: [feature/a-style-paper-light-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanxi-a-style-preview
  cancel-in-progress: false

jobs:
  package-art:
    runs-on: ubuntu-latest
    steps:
      - name: Download artwork into stable Pages media folder
        env:
          HERO_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2Fb05c69c0-63b7-4698-b9e8-ed8fa553194f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGeBqvprMdg6LKxIHhVygz43iiPiMlaAfhj7QZ32migA&exp=1792613610&osig=AAAAAAAAAAAAAAAAAAAAAGfBPWouF7JebqmwQ5pamvyH3Bogv8yH1L83tSIfsRG9&signer=media-rpc&token=AAIAAU0AJGIwNWM2OWMwLTYzYjctNDY5OC1iOWU4LWVkOGZhNTUzMTk0ZgAAAAABoWAY8hCvM4pzef6uTEI6fLQfo1qWYgkN2FcP_SQFy3UqavyuEA&x-canva-quality=thumbnail'
          HILLS_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:66/quality:75/uri:ifs%3A%2F%2FM%2Febd602cf-8f04-4e3a-b002-162b234bd2d7/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAL9nDU7Id0JHxLO1EFtCWH16dUIoiK-Ql3mOC0NxaVti&exp=1792614958&osig=AAAAAAAAAAAAAAAAAAAAAN2SzQYGE-L9UI_xtoRt1leFBvrm_T86IJqucLNML8IO&signer=media-rpc&token=AAIAAU0AJGViZDYwMmNmLThmMDQtNGUzYS1iMDAyLTE2MmIyMzRiZDJkNwAAAAABoWAtg7AB97Odly0GDPPt1pzC3raHf8it0Y1JuRCgIb-uSOmAGw&x-canva-quality=thumbnail'
          RIGHT_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F6ec58333-a37f-4e2e-8858-dec5ef45c5a1/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAC9Mz6qy71GCeO-5v17LVYfDYiHwLWKGI546er38FcOF&exp=1792612841&osig=AAAAAAAAAAAAAAAAAAAAAJwty69DJ1dDZ5bOijph2rrP4r7w2zOQqJv4Gqi_sTPR&signer=media-rpc&token=AAIAAU0AJDZlYzU4MzMzLWEzN2YtNGUyZS04ODU4LWRlYzVlZjQ1YzVhMQAAAAABoWANNihul3dLeq2oYIzV-cq411mzLXTvmm_iiqiOk5WHiFSkSg&x-canva-quality=thumbnail'
          LEFT_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7f30645f-6b0c-4336-a164-7ceff8165182/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAK4FNB0U5o7zWiDuyAi_Wm6mKwGxKb5pT83BKP8lZaVG&exp=1792615273&osig=AAAAAAAAAAAAAAAAAAAAAIYrXMqqUFpckCXFMTh9ZDwTukYEMdrXnxFVhADIzOHO&signer=media-rpc&token=AAIAAU0AJDdmMzA2NDVmLTZiMGMtNDMzNi1hMTY0LTdjZWZmODE2NTE4MgAAAAABoWAyUihtvyM_572N_-xEvXjumL_FRD_fvHDOn__tiJwq38jNgw&x-canva-quality=thumbnail'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-art
          fetch_art() {
            local source="$1" dest="$2" oldheight="$3" width="$4" height="$5"
            local full_url="${source/height:$oldheight/height:$height}"
            full_url="${full_url/width:200/width:$width}"
            if curl -fsSL --retry 1 --max-time 30 "$full_url" -o "$dest"; then
              echo "full-size art downloaded: $dest"
            else
              echo "Full-size variant not supported, retrieving fixed thumbnail: $dest"
              curl -fsSL --retry 2 --max-time 30 "$source" -o "$dest"
            fi
            test -s "$dest"
            file "$dest"
            du -h "$dest"
          }
          fetch_art "$HERO_URL" public-art/church-hero.jpg 112 800 450
          fetch_art "$HILLS_URL" public-art/hills.jpg 66 1200 400
          fetch_art "$RIGHT_URL" public-art/flowers-right.png 200 1254 1254
          fetch_art "$LEFT_URL" public-art/flowers-left.png 200 1254 1254
      - name: Publish self-hosted assets to existing preview media folder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public-art
          destination_dir: preview/a-style-v1/media
          keep_files: true
          enable_jekyll: true
